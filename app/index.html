<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cyberdeck — the showcase</title>
    <meta name="description" content="A component library of sci-fi HUD components that refuse to lie. Every component here is the real function, running." />
    <!-- The two faces the components were drawn against. The library names
         no font in its own source -- `--cd-mono` is supplied by the host,
         which is why it is set here rather than in tokens.css. Both fall
         back to a monospace / condensed stack so the page degrades to the
         same layout, not to a broken one. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Saira+Condensed:wght@700&display=swap" />
  </head>
  <body>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
